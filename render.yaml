services:
  - type: web
    name: railmarl-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        value: sqlite:///./railmarl.db
      - key: DEBUG
        value: "False"
      - key: STATION_NAME
        value: "Itarsi Junction (ET)"
      - key: STATION_CODE
        value: "ET"
      - key: RAILWAY_API_ENABLE_OFFLINE_MOCK
        value: "True"
